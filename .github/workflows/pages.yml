name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      NEXT_PUBLIC_WS_URL: ${{ vars.NEXT_PUBLIC_WS_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Validate production WebSocket configuration
        shell: bash
        run: |
          if [[ -z "$NEXT_PUBLIC_WS_URL" ]]; then
            echo "::warning::NEXT_PUBLIC_WS_URL is not configured; the static frontend will show realtime as unavailable."
          elif [[ "$NEXT_PUBLIC_WS_URL" != wss://* ]]; then
            echo "NEXT_PUBLIC_WS_URL must use wss:// for GitHub Pages." >&2
            exit 1
          fi
      - name: Build static frontend
        run: npm run build:pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: out
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
