services:
  - type: web
    name: gridline-realtime
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci --include=dev
    startCommand: npm run start:server
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://thenanosoft.github.io
